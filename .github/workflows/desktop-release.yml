name: Desktop CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-version.mjs

  ingest:
    name: Go ingest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ingest/go.mod
          cache: false
      - run: go test ./...
        working-directory: ingest
      - run: go build -o slidefarm-ingest .
        working-directory: ingest

  package:
    name: Package ${{ matrix.platform }} x64
    needs: [verify, ingest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target: nsis
            artifact: windows
          - os: macos-15-intel
            platform: mac
            target: dmg
            artifact: macos
          - os: ubuntu-latest
            platform: linux
            target: AppImage
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix electron
      - run: npm run build
      - run: npm run test:integration
      - name: Build installer
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: slidefarm-${{ matrix.artifact }}-x64
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: slidefarm-*-x64
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: (cd release-assets && sha256sum *.exe *.dmg *.AppImage > SHA256SUMS.txt)
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes -R "$GITHUB_REPOSITORY"
          fi
